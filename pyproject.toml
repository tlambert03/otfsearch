[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otfsearch"
version = "1.0.0"
description = "Local, single-process SIM reconstruction + OTF search GUI (cudasirecon)"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Talley Lambert", email = "talley.lambert@gmail.com" }]
keywords = ["SIM", "microscopy", "reconstruction", "cudasirecon", "OTF"]

# Pure-pip runtime dependencies.  NOTE: the reconstruction engine is the
# `cudasirecon` command-line executable, which comes from conda (it needs an
# NVIDIA GPU) and is intentionally NOT a pip dependency, so that
# `pip install otfsearch` works for the pure-python parts.  Install the
# MRC-capable build with:
#     conda install -c talley -c conda-forge cudasirecon
#
# numpy is pinned < 2 because the `mrc` package still calls the removed
# `ndarray.newbyteorder` when reading the engine's .dv output (to be fixed in mrc).
dependencies = [
    "numpy<2",
    "scipy",
    "scikit-image",
    "pandas",
    "mrc",
]

[project.optional-dependencies]
# channel registration (replaces the old MATLAB pipeline)
reg = ["fiducialreg"]
test = ["pytest"]

[project.scripts]
otfsearch = "otfsearch.gui.app:main"
otfsearch-cli = "otfsearch.cli:main"

[project.urls]
Source = "https://github.com/tlambert03/otfsearch"

[tool.hatch.build.targets.wheel]
packages = ["src/otfsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ─────────────────────────────────────────────────────────────────────────────
# pixi: reproducible, one-command environment (https://pixi.sh)
#   pixi run otfsearch     # launch the GUI
#   pixi run cli ...       # the command-line interface
#   pixi run test          # run the unit tests
# The cudasirecon reconstruction engine (GPU) is pulled from the `talley` conda
# channel; everything else resolves from conda-forge + PyPI.  Requires an NVIDIA
# GPU + driver supporting CUDA 12.
# ─────────────────────────────────────────────────────────────────────────────
[tool.pixi.workspace]
channels = ["talley", "conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
cudasirecon = ">=1.3.0"   # MRC-capable, IVE-free engine (talley channel)
numpy = "<2"              # mrc still calls the removed ndarray.newbyteorder
scipy = "*"
scikit-image = "*"
pandas = "*"
tk = "*"                  # tkinter GUI
pytest = "*"              # for `pixi run test`

[tool.pixi.pypi-dependencies]
# the otfsearch package itself, installed editable from this repo
otfsearch = { path = ".", editable = true }
mrc = "*"
# channel registration (not on PyPI -> install from the source repo)
fiducialreg = { git = "https://github.com/tlambert03/fiducialreg.git" }

[tool.pixi.tasks]
otfsearch = "otfsearch"
cli = "otfsearch-cli"
test = "pytest"
# quick environment sanity check (no GUI window)
check = "python -c \"import otfsearch, mrc, scipy, skimage, pandas; import shutil; print('otfsearch OK; cudasirecon on PATH:', bool(shutil.which('cudasirecon')))\""
